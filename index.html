<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鈺德的 GitHub Playground</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <p class="eyebrow">HELLO, GITHUB</p>
    <h1>我的第一個 GitHub 靜態網站</h1>
    <p class="lead">
      這個頁面只有 HTML、CSS 和一點 JavaScript。
      沒有框架、沒有資料庫，先把 GitHub 工作流程學會。
    </p>

    <section class="grid">
      <article>
        <h2>HTML</h2>
        <p>負責頁面的內容與結構。</p>
      </article>
      <article>
        <h2>CSS</h2>
        <p>負責排版、外觀與響應式設計。</p>
      </article>
      <article>
        <h2>JavaScript</h2>
        <p>負責互動行為。</p>
      </article>
    </section>

    <button id="helloBtn">按我一下</button>
    <p id="message" aria-live="polite"></p>

    <footer>branch → commit → PR → merge → Pages</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
